name: Bug report
description: Report a reproducible problem with JKL Instagram Backup
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please redact private usernames, cookies, tokens, local paths, and personal media IDs before posting logs publicly.

  - type: input
    id: version
    attributes:
      label: Userscript version
      placeholder: "1.5.57"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Profile scan
        - Reels
        - Stories / Highlights
        - Tagged
        - Local archive verification
        - Full download
        - Standalone download button
        - UI
        - Other
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Redacted log
      description: Paste the relevant userscript log with private identifiers removed.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed cookies, tokens, private usernames, local paths, and other sensitive information.
          required: true
