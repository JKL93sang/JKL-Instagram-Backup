name: Userscript CI

on:
  push:
    branches:
      - main
    paths:
      - 'JKL_Instagram_Backup.user.js'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: userscript-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: node --check JKL_Instagram_Backup.user.js

      - name: Identity and static regression tests
        run: node tests/identity-regression.test.mjs

      - name: UI geometry regression tests
        run: node tests/ui-geometry-regression.test.mjs

      - name: UI intrinsic width regression tests
        run: node tests/ui-intrinsic-width-regression.test.mjs

      - name: Owned discovery semantics regression tests
        run: node tests/owned-discovery-regression.test.mjs

      - name: PROFILE completion proof regression tests
        run: node tests/profile-completion-regression.test.mjs

      - name: Large account safety regression tests
        run: node tests/large-account-safety-regression.test.mjs

      - name: Single download controller regression tests
        run: node tests/single-download-regression.test.mjs

      - name: Public distribution metadata regression tests
        run: node tests/public-distribution-regression.test.mjs

      - name: Profile HTML identity fallback regression tests
        run: node tests/profile-html-identity-regression.test.mjs

      - name: Safe GraphQL response diagnostic regression tests
        run: node tests/json-endpoint-diagnostic-regression.test.mjs

      - name: Instagram public SSR clips metadata identity and contradiction tests
        run: node tests/profile-ssr-reels-evidence-regression.test.mjs

      - name: Explicit zero REELS metadata and independent public-grid proof tests
        run: node tests/reels-explicit-zero-proof-regression.test.mjs

      - name: REELS absent-tab safe skip regression tests
        run: node tests/no-reels-tab-regression.test.mjs

      - name: REELS evidence and authenticated-request safety architecture tests
        run: node tests/reels-evidence-and-request-safety-regression.test.mjs

      - name: Surface-to-file integrity and target-only public fallback integration tests
        run: node tests/selected-surface-archive-integrity.test.mjs

      - name: REELS verified-native cursor pagination tests
        run: node tests/reels-native-pagination-regression.test.mjs

      - name: Local archive indexed counts presentation tests
        run: node tests/local-archive-index-display-regression.test.mjs

      - name: Native PROFILE bootstrap capture lifecycle and no-reentry tests
        run: node tests/profile-native-bootstrap-regression.test.mjs

      - name: Native Relay profile pagination regression tests
        run: node tests/native-profile-relay-regression.test.mjs

      - name: Native capture provenance, privacy and transport isolation tests
        run: node tests/native-capture-provenance-regression.test.mjs

      - name: Full-scan public PROFILE and zero REELS integration tests
        run: node tests/profile-public-first-scan-integration.test.mjs

      - name: Public-first PROFILE completion with independent REELS guard
        run: node tests/profile-public-first-regression.test.mjs

      - name: PROFILE cross-surface pagination proof regression tests
        run: node tests/profile-cross-surface-proof-regression.test.mjs

      - name: Subscriber-authorized partial backup safety regression tests
        run: node tests/subscriber-verified-partial-regression.test.mjs

      - name: Verified accessible partial backup and immutable provenance tests
        run: node tests/accessible-verified-partial-regression.test.mjs

      - name: Distinct highlight reel identity, path grouping and archive repair tests
        run: node tests/highlight-identity-folders-regression.test.mjs

      - name: Unique FAN CLUB / flat HIDDEN category routing tests
        run: node tests/single-copy-archive-routing-regression.test.mjs
